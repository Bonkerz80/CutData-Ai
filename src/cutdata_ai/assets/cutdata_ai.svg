<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">PPT CutData AI</title>
  <desc id="desc">PPT target mark with a CutData AI product label</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15191b"/>
      <stop offset="1" stop-color="#15191b"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="242" height="242" rx="33" fill="url(#plate)" stroke="#ccd3d7" stroke-width="3"/>
  <!-- PPT's black target/cross and red inner ring, kept recognisable at icon size. -->
