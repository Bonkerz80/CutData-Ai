  <path d="M128 36V170M61 103H195" fill="none" stroke="#f4f6f7" stroke-width="7"/>
  <circle cx="128" cy="103" r="45.5" fill="#0b0d0e" stroke="#CE1D1D" stroke-width="6"/>
  <circle cx="128" cy="103" r="14" fill="#CE1D1D"/>
  <rect x="40" y="187" width="176" height="46" rx="13" fill="url(#bar)"/>
  <rect x="46" y="193" width="164" height="34" rx="10" fill="none" stroke="#CE1D1D" stroke-width="2"/>
  <text x="58" y="218" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">CD</text>
  <text x="180" y="217" fill="#CE1D1D" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PPT</text>
