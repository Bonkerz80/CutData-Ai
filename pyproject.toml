[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutdata-ai"
version = "0.2.9"
description = "AI-guided CNC machining adviser with a persistent workshop tool library"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.2",
    "openai>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
