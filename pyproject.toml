[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutdata-ai"
version = "0.1.0"
description = "A practical AI-assisted CNC speeds-and-feeds calculator"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openai>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
