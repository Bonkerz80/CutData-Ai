name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build the bundled application
        shell: pwsh
        run: .\build_windows.ps1

      - name: Verify real window startup with a clean environment
        shell: pwsh
        run: .\.venv-build\Scripts\python.exe scripts/verify_windows_bundle.py "dist/CutData AI/CutData AI.exe" --launch-check

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the full installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CutData-AI-Windows-Installer
          path: installer/CutData-AI-Setup-0.1.4.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "CutData AI $tag" --generate-notes
          }
          gh release upload $tag "installer\CutData-AI-Setup-0.1.4.exe" --repo "${{ github.repository }}" --clobber
